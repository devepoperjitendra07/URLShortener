spring.application.name=url-shortener

# ─── Server ─────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8082}

# Public base URL used to build short links (override per environment).
app.base-url=${APP_BASE_URL:http://localhost:8082/api}

# ─── Database ───────────────────────────────────────────────────────────────
# All credentials are read from the environment. The defaults below match the
# local docker-compose dev stack only — never point production at them.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/urlshortener}
spring.datasource.username=${DB_USERNAME:adda247}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─── Flyway ─────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ─── Redis ──────────────────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=3000ms

# ─── JWT Config ─────────────────────────────────────────────────────────────
# HS256 signing key (>= 32 bytes). MUST be set via JWT_SECRET in any real
# deployment. The default is an obvious dev-only placeholder, not a real key.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-min-32-bytes}
app.jwt.expiry-ms=${JWT_EXPIRY_MS:86400000}

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.goindiainfotech.urlshortener=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=INFO